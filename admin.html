<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lash Cartel Admin</title><style>
body{margin:0;background:#fffaf8;color:#2c2622;font:14px/1.5 Arial,sans-serif}header{background:#f5d6d2;padding:18px 24px;display:flex;align-items:center;gap:20px}header img{height:56px}main{max-width:1080px;margin:auto;padding:30px 20px}h1,h2{font-family:Georgia,serif}section{background:white;padding:24px;margin:20px 0;border:1px solid #e8b5ae;border-radius:14px}input,button{font:inherit;padding:9px;border-radius:8px}input{border:1px solid #d98f86}button{background:#2c2622;color:white;border:0;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #c2766c;outline-offset:2px}.row{border-top:1px solid #f5d6d2;padding:14px 0}.row p{margin:3px 0;overflow-wrap:anywhere}.muted{color:#6b615b;font-size:12px}.stock-row{display:flex;align-items:center;gap:15px;margin:8px 0}.stock-row label{min-width:150px}#dashboard[hidden],#login[hidden]{display:none}
</style></head><body><header><a href="/"><img src="/assets/logo.png" alt="Lash Cartel"></a><strong>Admin</strong></header><main>
<section id="login"><h1>Sign in</h1><form id="login-form"><label>Password <input id="password" type="password" autocomplete="current-password" required></label> <button>Sign in</button></form><p id="login-status" role="status"></p></section>
<div id="dashboard" hidden><h1>Store overview</h1><section><h2>Stock</h2><div id="stock"></div></section><section><h2>Orders</h2><div id="orders"></div></section><section><h2>Partner enquiries</h2><div id="enquiries"></div></section></div>
</main><script>
const endpoints={data:'/api/admin-data',stock:'/api/admin-stock',dispatch:'/api/admin-dispatch'};
async function post(url,body){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data;}
function row(parent,title,details){const div=document.createElement('div');div.className='row';const strong=document.createElement('strong');strong.textContent=title;div.append(strong);for(const detail of details){const p=document.createElement('p');p.textContent=detail;div.append(p);}parent.append(div);return div;}
async function load(){const response=await fetch(endpoints.data,{cache:'no-store'});if(response.status===401)return;const data=await response.json();if(!response.ok)throw Error(data.error||'Could not load admin');document.getElementById('login').hidden=true;document.getElementById('dashboard').hidden=false;
const stock=document.getElementById('stock');stock.replaceChildren();for(const item of data.stock){const div=document.createElement('div');div.className='stock-row';const label=document.createElement('label');label.textContent=item.product_key;const box=document.createElement('input');box.type='checkbox';box.checked=item.in_stock;box.setAttribute('aria-label',`${item.product_key} in stock`);box.addEventListener('change',async()=>{try{await post(endpoints.stock,{key:item.product_key,inStock:box.checked})}catch(e){box.checked=!box.checked;alert(e.message)}});div.append(label,box);stock.append(div);}
const orders=document.getElementById('orders');orders.replaceChildren();for(const order of data.orders){const div=row(orders,`${order.order_number||'Pending'} · ${order.status}`,[order.customer_email,`Total $${(order.total_cents/100).toFixed(2)} AUD`]);if(order.status==='paid'){const input=document.createElement('input');input.placeholder='Australia Post tracking number (optional)';input.setAttribute('aria-label',`Tracking number for ${order.order_number}`);const button=document.createElement('button');button.textContent='Mark dispatched';button.addEventListener('click',async()=>{try{await post(endpoints.dispatch,{id:order.id,tracking:input.value});await load()}catch(e){alert(e.message)}});div.append(input,button);}}
const enquiries=document.getElementById('enquiries');enquiries.replaceChildren();for(const enquiry of data.enquiries){row(enquiries,`${enquiry.kind} · ${enquiry.business}`,[enquiry.name,enquiry.email,enquiry.phone,enquiry.location,enquiry.rental_period,enquiry.intended_placement,enquiry.message,`Email: ${enquiry.email_status}`].filter(Boolean));}}
document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();const status=document.getElementById('login-status');try{await post('/api/admin-login',{password:document.getElementById('password').value});document.getElementById('password').value='';await load()}catch(e){status.textContent=e.message}});
load().catch(e=>{document.getElementById('login-status').textContent=e.message});
</script></body></html>
