<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Restore Your Cart | Lash Cartel</title></head><body style="background:#fffaf8;color:#2c2622;font:16px Arial,sans-serif;text-align:center;padding:12vh 20px"><img src="/assets/logo.png" alt="Lash Cartel" width="140"><h1>Your lash look is waiting</h1><p id="status">Restoring your bag...</p><script src="/assets/catalog.js"></script><script>
const meta={
'DIY Cluster Lash Kit — Volume':['Complete DIY Set','lash','/assets/products/cluster-lash-kit/Volume/volume_main.jpg','Volume Set'],
'DIY Cluster Lash Kit — Natural':['Complete DIY Set','lash','/assets/products/cluster-lash-kit/Natural/Natural_Main.jpg','Natural Set'],

</script></body></html>
