<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Order | Lash Cartel</title><style>body{margin:0;background:#fffaf8;color:#2c2622;font:15px/1.6 Arial,sans-serif}header{background:#f5d6d2;padding:18px;text-align:center}header img{height:70px}main{max-width:680px;margin:40px auto;padding:24px;background:white;border-radius:16px}h1{font-family:Georgia,serif}table{width:100%;border-collapse:collapse}td{border-bottom:1px solid #e8b5ae;padding:10px 0}td:last-child{text-align:right}</style></head><body><header><a href="/"><img src="/assets/logo.png" alt="Lash Cartel"></a></header><main><h1>Your order</h1><div id="details" role="status">Loading your order...</div></main><script>
const money=n=>'$'+(n/100).toFixed(2)+' AUD';
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/order-details'+location.search).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error);return data}).then(o=>{
document.getElementById('details').innerHTML=`<p><b>${safe(o.order_number)}</b> · ${safe(o.status)}</p><table>${o.items.map(i=>`<tr><td>${safe(i.name)} × ${i.quantity}</td><td>${money(i.lineCents)}</td></tr>`).join('')}<tr><td>Discount</td><td>-${money(o.discount_cents)}</td></tr><tr><td>Delivery</td><td>${money(o.shipping_cents)}</td></tr><tr><td><b>Total, tax included</b></td><td><b>${money(o.total_cents)}</b></td></tr></table>${o.tracking_number?`<p>Australia Post tracking: ${safe(o.tracking_number)}</p>`:''}`;
}).catch(e=>{document.getElementById('details').textContent=e.message||'Could not load the order.'});
</script></body></html>
