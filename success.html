<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmed — Lash Cartel Cosmetics</title>
<meta name="description" content="Your Lash Cartel order is confirmed. Thank you for shopping with us." />
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico?v=3" sizes="any" />
<link rel="icon" type="image/png" href="/assets/favicon.png?v=3" />
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:linear-gradient(180deg,#f5d6d2,#fbe9e6); color:#2c2622; font-family:'Poppins',sans-serif; min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; }
  .card { max-width:500px; width:100%; }
  .badge { width:84px; height:84px; border-radius:50%; margin:0 auto 26px; display:grid; place-items:center; background:#d98f86; box-shadow:0 16px 36px rgba(178,118,108,0.35); }
  h1 { font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:600; margin-bottom:14px; }
  h1 .script { font-family:'Pinyon Script',cursive; color:#c2766c; }
  p { color:#6b615b; font-size:16px; margin-bottom:10px; }
  .em { color:#c2766c; font-weight:500; }
  .order-box { background:rgba(255,255,255,0.6); border:1px solid rgba(44,38,34,0.10); border-radius:16px; padding:22px 24px; margin:26px 0 4px; }
  .order-box .lbl { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#c2766c; font-weight:600; margin-bottom:6px; }
  .order-box .num { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; letter-spacing:1px; }
  .order-box .row { display:flex; justify-content:space-between; font-size:14px; color:#6b615b; margin-top:14px; padding-top:14px; border-top:1px dashed rgba(44,38,34,0.15); }
  .order-box .row b { color:#2c2622; font-weight:600; }
  a.btn { display:inline-block; margin-top:28px; background:#d98f86; color:#fff; padding:15px 34px; border-radius:50px; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; text-decoration:none; }
  a.btn:hover { background:#c2766c; }
  .muted { font-size:12.5px; color:#9a8f88; margin-top:18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Order <span class="script">Confirmed</span></h1>
    <p>Thank you — your payment went through and your order is locked in.</p>

    <div class="order-box" id="orderBox" style="display:none;">
      <div class="lbl">Order number</div>
      <div class="num" id="orderNum">—</div>
      <div class="row"><span>Total paid</span><b id="orderTotal">—</b></div>
    </div>

    <p>We'll pack your <span class="em">Lash Cartel</span> order and post it within 5–7 business days.</p>
    <p class="muted">Take a screenshot of your order number for your records.</p>
    <a class="btn" href="/">Back to Shopping</a>
  </div>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const pi = params.get('payment_intent');
    const status = params.get('redirect_status');
    const box = document.getElementById('orderBox');

    function fmt(amount, currency) {
      return '$' + (amount / 100).toFixed(2) + ' ' + (currency || 'aud').toUpperCase();
    }

    if (!pi || (status && status !== 'succeeded')) return;

    fetch('/api/order?payment_intent=' + encodeURIComponent(pi))
      .then(r => r.json())
      .then(d => {
        if (d.error) return;
        document.getElementById('orderNum').textContent = d.orderNumber || ('LC-' + pi.slice(-6).toUpperCase());
        if (typeof d.amount === 'number') document.getElementById('orderTotal').textContent = fmt(d.amount, d.currency);
        else document.querySelector('#orderBox .row').style.display = 'none';
        box.style.display = 'block';
      })
      .catch(() => {});
  })();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
