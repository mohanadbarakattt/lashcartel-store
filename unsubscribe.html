<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Unsubscribe | Lash Cartel</title><style>body{background:#fffaf8;color:#2c2622;font:16px/1.5 Arial,sans-serif;margin:0}main{max-width:500px;margin:12vh auto;background:#fbe9e6;border-radius:16px;padding:30px;text-align:center}button{background:#2c2622;color:white;padding:12px 24px;border:0;border-radius:25px;cursor:pointer}</style></head><body><main><img src="/assets/logo.png" alt="Lash Cartel" width="130"><h1>Unsubscribe</h1><p>Stop these Lash Cartel reminder emails?</p><button id="confirm">Unsubscribe</button><p id="status" role="status"></p></main><script>document.getElementById('confirm').addEventListener('click',async()=>{const query=new URLSearchParams(location.search);const response=await fetch('/api/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:query.get('type'),id:query.get('id'),sig:query.get('sig')})});document.getElementById('status').textContent=response.ok?'You have been unsubscribed.':'The link could not be processed.';});</script></body></html>
